name: AI Project Risk Radar (Grok)

# GRAPH: explicit nodes and failure branches
# collect -> analyze (Grok|heuristic) -> verify -> publish -> dashboard -> commit
#
# LOOP: verify_risk_report must pass before publish/commit
# HARNESS: secrets, demo data fallback, isolated runner, traces via Actions logs

on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  risk-radar:
    runs-on: ubuntu-latest
    steps:
      - name: "[HARNESS] Checkout"
        uses: actions/checkout@v5

      - name: "[HARNESS] Set up Python"
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: "[HARNESS] Install dependencies"
        run: pip install openai

      - name: "[NODE] Collect project data"
        id: collect
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m src.collectors.github_collector

      - name: "[NODE] Analyze risks (Grok with heuristic fallback)"
        id: analyze
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: python -m src.analyzers.risk_analyzer_grok

      - name: "[LOOP] Verify report quality"
        id: verify
        run: python -m src.validators.verify_risk_report

      - name: "[NODE] Publish Risk Report as Issue"
        id: publish
        if: success()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m src.reporters.report_generator

      - name: "[NODE] Copy report JSON into dashboard"
        if: success()
        run: |
          mkdir -p dashboard
          cp data/risk_report.json dashboard/risk_report.json

      - name: "[NODE] Commit dashboard data"
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboard/risk_report.json data/risk_report.md data/risk_report.json || true
          git diff --staged --quiet || git commit -m "chore: update risk report $(date -u +%Y-%m-%d)"
          git push || true

      - name: "[GRAPH] Run summary"
        if: always()
        run: |
          echo "collect=${{ steps.collect.outcome }}"
          echo "analyze=${{ steps.analyze.outcome }}"
          echo "verify=${{ steps.verify.outcome }}"
          echo "publish=${{ steps.publish.outcome }}"
          if [ ! -f data/risk_report.json ]; then
            echo "No risk_report.json produced"
            exit 1
          fi
          python -c "import json; d=json.load(open('data/risk_report.json')); print('source=', d.get('source'), 'level=', d.get('overall_risk_level'))"
